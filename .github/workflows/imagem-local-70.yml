name: Imagem local do CRM 1.55 com 70 capacidades

on:
  push:
    branches: [crm-70-v155]

permissions:
  contents: read
  packages: write

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Preparar nome da imagem
        id: imagem
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deskcommcrm:crm-70-v155" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.imagem.outputs.nome }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            APP_VERSION=1.55.0-local-70
          cache-from: type=gha,scope=crm-70-v155
          cache-to: type=gha,mode=max,scope=crm-70-v155

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Preparar nome da imagem
        id: imagem
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deskcommcrm-worker:crm-70-v155" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.imagem.outputs.nome }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            APP_VERSION=1.55.0-local-70
          cache-from: type=gha,scope=crm-70-v155-worker
          cache-to: type=gha,mode=max,scope=crm-70-v155-worker
